version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: frogs-web
    ports:
      - "8090:80"
    volumes:
      - ./src:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - frogs-net

  api:
    build: ./api
    container_name: frogs-api
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: frogs_db
    depends_on:
      - db
    networks:
      - frogs-net
    restart: on-failure

  db:
    image: postgres:15-alpine
    container_name: frogs-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frogs_db
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql/data
    networks:
      - frogs-net

volumes:
  pg_data:

networks:
  frogs-net: